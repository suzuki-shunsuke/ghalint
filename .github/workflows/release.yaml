---
name: Release
on:
  push:
    tags: [v*]
jobs:
  release:
    uses: suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml@059116b437911b78b0130d0f219fe80de1eae4e8 # v10.1.3
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}
    with:
      aqua_version: v2.65.2
      go-version-file: go.mod
      packslip: true
    permissions:
      contents: write
      id-token: write
      actions: read
      attestations: write
